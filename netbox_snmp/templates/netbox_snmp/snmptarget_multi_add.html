{% extends 'base/layout.html' %}
{% load form_helpers %}

{% block content %}
<div class="row">
  <div class="col col-md-7 offset-md-2">
    <form method="post" class="form">
      {% csrf_token %}
      {% render_form form %}
      <div class="btn-float-group-right">
        <a href="{% url 'plugins:netbox_snmp:snmptarget_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="mdi mdi-plus-thick"></i> Add targets
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
